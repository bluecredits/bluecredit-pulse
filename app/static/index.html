<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueCredit Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C11 11 7 15.5 7 20a9 9 0 0 0 18 0c0-4.5-4-9-9-17z' fill='%231F6F86'/%3E%3C/svg%3E">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <svg class="drop" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C11 11 7 15.5 7 20a9 9 0 0 0 18 0c0-4.5-4-9-9-17z"/></svg>
    <h1 class="app-name">BlueCredit Pulse</h1>
    <p class="muted">Sign in to see the pipeline and run reviews.</p>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="loginError" role="alert"></p>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <a class="brand" href="#/dashboard">
      <svg class="drop" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C11 11 7 15.5 7 20a9 9 0 0 0 18 0c0-4.5-4-9-9-17z"/></svg>
      <span class="app-name">BlueCredit Pulse</span>
    </a>
    <nav id="nav">
      <a href="#/dashboard" data-r="dashboard">Today</a>
      <a href="#/reviews" data-r="reviews">Reviews</a>
      <span class="nav-gap"></span>
      <a href="#/opportunities" data-r="opportunities">Opportunities</a>
      <a href="#/funding" data-r="funding">Funding</a>
      <a href="#/contacts" data-r="contacts">Contacts</a>
      <a href="#/actions" data-r="actions">Action items</a>
      <a href="#/resources" data-r="resources">Resources</a>
      <span class="nav-gap"></span>
      <a href="#/activity" data-r="activity">Activity log</a>
    </nav>
    <div class="side-foot">
      <span id="whoami"></span>
      <button class="link" id="logout">Sign out</button>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<div id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-scrim" data-close></div>
  <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </header>
    <div id="drawerBody" class="drawer-body"></div>
  </section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
