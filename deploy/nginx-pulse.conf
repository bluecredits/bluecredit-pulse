# Pulse — pulse.bluecredits.org on the Contabo VPS.
# Only this server block is Pulse's; it doesn't change any other site on the server.
# install.sh copies it to /etc/nginx/sites-available/pulse.bluecredits.org; certbot then adds the HTTPS lines.
server {
    listen 80;
    listen [::]:80;
    server_name pulse.bluecredits.org;

    root /var/www/bluecredit-pulse;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # the two server functions (Deno, localhost only)
    location ^~ /fn/calendar {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
    location ^~ /fn/chief {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # static site: short cache for code so updates show up, longer for icons/fonts
    location ~* \.(js|css|html)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
